name: Deploy

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script_stop: true
          script: |
            set -euo pipefail

            # Make sure GitHub host key is known (prevents interactive prompt)
            mkdir -p /root/.ssh
            chmod 700 /root/.ssh
            ssh-keyscan -H github.com >> /root/.ssh/known_hosts
            chmod 600 /root/.ssh/known_hosts

            # Force git to use the deploy key that is stored on the server
            export GIT_SSH_COMMAND="ssh -i /root/.ssh/github_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"

            cd /opt/knu-students-rating
            git pull origin main

            cd frontend
            npm ci
            npm run build
            cd ..

            chmod +x mvnw
            ./mvnw -DskipTests package
            cp "$(ls target/pract-*.jar | grep -v '\.original$' | head -n1)" /opt/knu-students-rating/deploy/backend.jar

            cd Gateway-server-main
            npm ci

            systemctl restart knu-backend
            systemctl restart knu-gateway
            systemctl status knu-backend --no-pager
            systemctl status knu-gateway --no-pager
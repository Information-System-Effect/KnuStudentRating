<!DOCTYPE html>
<html lang="uk">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Шлюз «ІС ефект»</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <main class="app-shell">
    <header class="page-header">
      <h1>Шлюз «ІС ефект»</h1>
      <p class="subtitle">
        Введіть текстовий запит у форматі:
        <code>SENDER_CODE#TARGET_USER_CODE#METHOD#TARGET_FIELD#PARAMS</code>
      </p>
    </header>

    <section class="workspace">
      <div class="left-column">
        <section class="panel compact-panel">
          <label for="requestInput">Текст запиту</label>
          <textarea id="requestInput" rows="5" placeholder="Наприклад: L1#U2#PUT#LANG_JAVA#+10"></textarea>

          <div class="buttons">
            <button id="validateBtn">Перевірити запит</button>
            <button id="clearBtn" class="secondary">Очистити</button>
          </div>
        </section>

        <section class="panel examples-panel">
          <h2>Приклади для демонстрації</h2>

          <h3>Коректні запити</h3>
          <div class="examples">
            <button class="example-btn" data-example="U1#_#GET#STUDENTS#page=1;limit=20">
              GET список студентів
            </button>

            <button class="example-btn" data-example="L1#_#GET#STUDENTS#page=2;limit=10">
              GET список студентів (інша сторінка)
            </button>

            <button class="example-btn" data-example="U1#U2#GET#PROFILE#id=U2">
              GET профіль користувача
            </button>

            <button class="example-btn" data-example="L1#U2#PUT#LANG_JAVA#+10">
              PUT технічна оцінка викладачем
            </button>

            <button class="example-btn" data-example="L1#U2#PUT#TEAMWORK#+4">
              PUT суб’єктивна оцінка викладачем
            </button>

            <button class="example-btn" data-example="U1#U2#PUT#TEAMWORK#+3">
              PUT суб’єктивна оцінка студентом
            </button>

            <button class="example-btn" data-example="L1#U2#PUT#LANG_JAVA#+10#MY_SQL#-5#TEAMWORK#+4">
              PUT кілька полів
            </button>

            <button class="example-btn" data-example="L1#U2#PATCH#LANG_JAVA#+8">
              PATCH одна оцінка
            </button>

            <button class="example-btn" data-example="L1#U2#PATCH#LANG_JAVA#+8#ALGORITHMS#+7">
              PATCH кілька полів
            </button>

            <button class="example-btn" data-example="L1#U2#DELETE#RATING#reason=reset">
              DELETE викладачем
            </button>
          </div>

          <h3>Помилки структури</h3>
          <div class="examples">
            <button class="example-btn" data-example="U1#U2#PUT#LANG_JAVA">
              PUT без значення
            </button>

            <button class="example-btn" data-example="U1#_#GET#STUDENTS">
              GET без параметрів
            </button>

            <button class="example-btn" data-example="L1#U2#PUT#LANG_JAVA#+10#MY_SQL">
              Непарна кількість FIELD/PARAMS
            </button>

            <button class="example-btn" data-example="L1#_#PUT#LANG_JAVA#+10">
              PUT без цільового користувача
            </button>

            <button class="example-btn" data-example="U1#_#GET#STUDENTS#page=1;limit=20#EXTRA">
              GET із зайвим полем
            </button>
          </div>

          <h3>Помилки формату</h3>
          <div class="examples">
            <button class="example-btn" data-example="U 1#_#GET#STUDENTS#page=1;limit=20">
              Некоректний SENDER_CODE
            </button>

            <button class="example-btn" data-example="U1#U 2#GET#STUDENTS#page=1;limit=20">
              Некоректний TARGET_USER_CODE
            </button>

            <button class="example-btn" data-example="U1#_#FETCH#STUDENTS#page=1;limit=20">
              Недопустимий метод
            </button>

            <button class="example-btn" data-example="U1#_#GET#students#page=1;limit=20">
              Некоректний TARGET_FIELD
            </button>

            <button class="example-btn" data-example="U1#_#GET#STUDENTS#page1;limit=20">
              Некоректні query-параметри
            </button>

            <button class="example-btn" data-example="L1#U2#PUT#LANG_JAVA#10">
              Зміна без знака +/-
            </button>

            <button class="example-btn" data-example="L1#U2#PUT#LANG_JAVA#+abc">
              Некоректне числове значення
            </button>
          </div>

          <h3>Порушення прав доступу / діапазонів</h3>
          <div class="examples">
            <button class="example-btn" data-example="U1#U2#PUT#TEAMWORK#+10">
              Студент: перевищення ліміту
            </button>

            <button class="example-btn" data-example="L1#U2#PUT#TEAMWORK#+10">
              Викладач: перевищення ліміту для subjective
            </button>

            <button class="example-btn" data-example="L1#U2#PUT#LANG_JAVA#+25">
              Викладач: перевищення ліміту для technical
            </button>

            <button class="example-btn" data-example="U1#U2#DELETE#RATING#reason=reset">
              DELETE заборонений студенту
            </button>
          </div>
        </section>
      </div>

      <div class="right-column">
        <section class="panel result-panel">
          <h2>Результат перевірки</h2>
          <div id="statusBox" class="status neutral">Очікується запит…</div>
          <pre id="responseOutput" class="output">{}</pre>
        </section>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>

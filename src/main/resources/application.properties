spring.application.name=pract
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/practw}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
spring.jpa.hibernate.ddl-auto=none
spring.servlet.multipart.max-file-size=${APP_MULTIPART_MAX_FILE_SIZE:6MB}
spring.servlet.multipart.max-request-size=${APP_MULTIPART_MAX_REQUEST_SIZE:6MB}
app.jwt.secret=${APP_JWT_SECRET:replace-this-secret-in-env}
app.jwt.access-ttl-seconds=${APP_JWT_ACCESS_TTL_SECONDS:900}
app.jwt.refresh-ttl-seconds=${APP_JWT_REFRESH_TTL_SECONDS:2592000}
app.jwt.issuer=${APP_JWT_ISSUER:knu-students-rating}
app.auth.refresh-cookie-name=${APP_AUTH_REFRESH_COOKIE_NAME:knu_refresh_token}
app.auth.refresh-cookie-secure=${APP_AUTH_REFRESH_COOKIE_SECURE:false}
app.auth.refresh-cookie-same-site=${APP_AUTH_REFRESH_COOKIE_SAME_SITE:Strict}
app.auth.refresh-cookie-path=${APP_AUTH_REFRESH_COOKIE_PATH:/api/auth}
springdoc.swagger-ui.path=/swagger-ui.html
app.gateway.shared-secret=${GATEWAY_SHARED_SECRET:}
app.gateway.shared-secret-header=${GATEWAY_SHARED_SECRET_HEADER:X-Gateway-Secret}
app.uploads.dir=${APP_UPLOADS_DIR:uploads}
app.uploads.max-photo-bytes=${APP_UPLOADS_MAX_PHOTO_BYTES:5242880}
server.port=8081
